{% extends 'base.html' %} 

{% block title %}404. Контент не найден.{% endblock %}

{% block content %}
<section class="container my-5">
  <div class="row align-items-center">

    <div class="col-12 col-lg-7 my-4 text-center text-lg-start">
      <h1 class="mb-4" style="font-size: 5rem; color: #3e9760;">404</h1>
      <h2 class="mb-3">Котик стащил эту страницу!</h2>
      <p class="lead mb-4">Похоже, такой игры или страницы не существует. Возможно, вы ошиблись адресом или ссылка устарела.</p>
      
      <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center justify-content-lg-start">
        <a href="{{ url_for('index') }}" class="btn btn-success btn-lg">
          🎲 На главную
        </a>
      </div>
    </div>

    <div class="col-12 col-lg-5 my-4">
      <img class="img-fluid mx-auto d-block" src="{{ url_for('static', filename='img/404.png') }}" alt="404 Ошибка" />
    </div>

  </div>
</section>
{% endblock %}
