volumes:
  pg_data:

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8000"
    command: sh -c "flask db upgrade && gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 asgi:application"